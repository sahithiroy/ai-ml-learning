services:

  # Container 1: MySQL
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ml_database
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Container 2: Python + FastAPI
  fastapi:
    build: ./app
    ports:
      - "8000:8000"
    depends_on:
      - mysql

volumes:
  mysql_data: